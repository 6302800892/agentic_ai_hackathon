[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-intake-copilot"
version = "0.1.0"
description = "BC-AAIE-HACK-10 - LangGraph multi-agent patient intake & care-coordination copilot (Gemini, MCP, Phoenix)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - hackathon submission" }
keywords = ["langgraph", "mcp", "gemini", "arize-phoenix", "agentic-ai", "healthcare"]
# Keep in sync with requirements.txt (pip install -r requirements.txt  ==  pip install -e ".[dev,api]")
dependencies = [
    # agent framework + Gemini (the ONLY model provider)
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.1",
    # memory
    "langgraph-checkpoint-sqlite>=2.0.10",
    "aiosqlite>=0.20",
    "langmem>=0.0.25",
    # MCP
    "mcp>=1.9",
    "langchain-mcp-adapters>=0.1",
    # retrieval
    "chromadb>=0.6",
    "sentence-transformers>=3.0",
    # observability
    "arize-phoenix>=8.0",
    "arize-phoenix-otel>=0.9",
    "openinference-instrumentation-langchain>=0.1.30",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "httpx>=0.27",
    # evaluation (2.x is incompatible with langchain 1.x)
    "deepeval>=3.0",
    # security
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "python-dotenv>=1.0",
    # utilities
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tenacity>=8.2",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "sse-starlette>=2.1"]
guard = ["llm-guard>=0.3"]           # optional PromptInjection scanner (src/context/quarantine.py)
screenshot = ["playwright>=1.44"]    # optional: scripts/capture_dashboard.py

[project.scripts]
copilot = "src.cli:app"              # copilot run --input data/samples/intake_requests.jsonl

[tool.setuptools.packages.find]
include = ["src*", "mcp_server*", "scripts*"]

# pytest settings live in pytest.ini (it takes precedence over this file).
