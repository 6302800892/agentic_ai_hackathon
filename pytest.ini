[pytest]
testpaths = tests
# third-party plugins we do not use (the phoenix/deepeval plugins import heavy deps at collection time)
addopts = -p no:phoenix -p no:deepeval -p no:langsmith_plugin
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: spawns the real MCP stdio server (offline, no API key)
filterwarnings =
    ignore::DeprecationWarning
